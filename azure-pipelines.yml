name: infra-pipeline

trigger: none

pool: agent-ka-gang

stages:
  - stage: initValidatePlan
    displayName: Init, Validate and Plan
    jobs:
      - job: initValidatePlanJob
        displayName: Init Validate Plan Job
        steps:
        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'wif-connect'
            backendAzureRmStorageAccountName: '1week'
            backendAzureRmContainerName: 'tondu'
            backendAzureRmKey: 'infra.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

        - task: TerraformTask@5
          displayName: Terraform Plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            environmentServiceNameAzureRM: 'wif-connect'

  - stage: securityScan
    displayName: Security Scan
    jobs:
      - job: securityScan
        displayName: Security Scan
        steps:
        - task: tfsec@1
          displayName: tfsec
          inputs:
            version: 'v1.26.0'
            publishTestResults: false
            dir: '$(System.DefaultWorkingDirectory)'


  # - stage: approvalAndApply








